<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="robots" content="noindex,nofollow">
<title>Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="lock" class="lock hidden">
  <div class="lock-card">
    <div class="logo-big">L</div>
    <h1>Life</h1>
    <p>Enter your passcode to unlock. It stays on this device.</p>
    <form id="lockForm"><input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" autofocus><button>Unlock</button></form>
    <div id="lockErr" class="err"></div>
  </div>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="brand"><span class="logo">L</span><span>Life</span></div>
    <nav id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main">
    <header class="top">
      <div>
        <div class="eyebrow" id="dateLine"></div>
        <h1 id="title">Today</h1>
      </div>
      <button class="sync" id="syncBtn" title="Refresh"><span id="syncText">…</span><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    </header>
    <div id="view" class="view"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
