<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="robots" content="noindex,nofollow">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon2-192.png">
<link rel="apple-touch-icon" href="icons/icon2-180.png">
<link rel="preload" href="fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css?v=31">
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="lock" class="lock hidden">
  <div class="lock-card">
    <div class="logo-big"></div>
    <h1>Jarvis</h1>
    <p>Enter your passcode to unlock. It stays on this device.</p>
    <form id="lockForm"><input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" autofocus><button>Unlock</button></form>
    <div id="lockErr" class="err"></div>
  </div>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="brand"><span class="logo"></span><span>JARVIS</span></div>
    <nav id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main">
    <header class="top">
      <div>
        <div class="eyebrow" id="dateLine"></div>
        <h1 id="title">Today</h1>
      </div>
      <button class="sync" id="syncBtn" title="Refresh"><span id="syncText">…</span><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    </header>
    <div id="view" class="view"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<button id="fab" class="fab hidden" aria-label="Jarvis"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<div id="sheet" class="sheet hidden"><div class="sheet-card">
  <div class="sheet-head"><div><b>J.A.R.V.I.S.</b><div class="small muted">Talk or type. I do it and reply here (usually 2 to 4 min).</div></div><div class="row" style="gap:8px"><button id="voiceToggle" class="iconbtn" aria-label="Voice replies"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button><button id="sheetClose" class="btn">Done</button></div></div>
  <div id="chat" class="chat"></div>
  <div class="composer"><textarea id="msg" rows="2" placeholder="e.g. Book a room Wed 2-4pm. Email Paolo to move lunch to 12."></textarea>
    <div class="comp-row"><button id="lang" class="chip" type="button">EN</button><span id="micState" class="small muted"></span><span id="wave" class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span style="flex:1"></span>
    <button id="mic" class="micbtn" type="button" aria-label="Dictate"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="send" class="btn pri" type="button">Send</button></div></div>
</div></div>
<div id="toast" class="toast"></div>
<script>window.FEATURES_WILL_BOOT = true;</script>
<script src="app.js?v=31"></script>
<script src="features.js?v=31"></script>
<script src="wayne.js?v=31"></script>
</body>
</html>
